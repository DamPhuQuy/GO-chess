services:
  katago:
    image: ghcr.io/goban-app/katago-server:latest
    environment:
      RUST_LOG: info
    expose:
      - "2718"
    ports:
      - "2718:2718"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:2718/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      KATAGO_API_URL: ${DOCKER_KATAGO_URL:-http://katago:2718}
      DATABASE_PATH: ${DATABASE_PATH:-data/goban.sqlite}
    volumes:
      - backend_data:/app/data
    expose:
      - "${PORT:-8080}"
    depends_on:
      katago:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:${PORT:-8080}/api/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  backend_data:
